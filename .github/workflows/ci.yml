name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] 

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npx prettier --check "**/*.{js,ts,tsx,json,css,md}"

      - name: Run tests
        run: npm test -- --run

      - name: Type-check and build
        run: npm run build
